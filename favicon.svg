<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0b3a78"/>
      <stop offset="1" stop-color="#031b3d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="122" height="122" rx="25" fill="url(#bg)"/>
  <rect x="5" y="5" width="118" height="118" rx="23"
        fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Bold white B -->
  <text x="64" y="78"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="900"
        fill="#ffffff">B</text>

  <!-- BSUN branding -->
  <text x="64" y="108"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="3"
        fill="#ffffff">BSUN</text>
</svg>
